name: Wasserstandsdaten aktualisieren

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Testnachricht aufs Handy schicken"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: BSH-Vorhersage laden
        run: |
          curl -fsSL --retry 3 --max-time 60 -H "Accept: application/geo+json" -o raw.tmp \
            "https://gdi.bsh.de/ldproxy/rest/services/WaterLevelForecast/collections/waterlevelforecastdata/items/norderney_riffgat?f=json&lang=de"
          jq -c '.properties | {
                forecast_timestamp,
                automated_curveforecast_timestamp,
                mean_high_water,
                mean_low_water,
                forecast_text: .forecast_text.de,
                high_water_low_water: [.high_water_low_water[] | {event_timestamp, event, tidal_prediction_value, forecast_value, mos_forecast_r0_value}],
                curve: [.curve[] | {timestamp, tidal_prediction, measurement, automated_curve_forecast}]
              }' raw.tmp > norderney.json.tmp
          test -s norderney.json.tmp
          mv norderney.json.tmp norderney.json
          rm -f raw.tmp
      - name: Push-Warnung prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAILS: ${{ secrets.NTFY_EMAILS }}
          TEST: ${{ inputs.test }}
        run: python3 .github/scripts/warnung.py
      - name: Datei speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add norderney.json
          if [ -f warnungen.json ]; then git add warnungen.json; fi
          git diff --staged --quiet || git commit -m "Vorhersage aktualisieren"
          git push

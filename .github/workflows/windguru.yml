name: Windguru-Daten aktualisieren

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/windguru.py"
      - ".github/workflows/windguru.yml"

permissions:
  contents: write

concurrency:
  group: windguru
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: curl_cffi installieren
        run: pip install --quiet curl_cffi
      - name: Windguru-Vorhersage laden
        run: python3 .github/scripts/windguru.py
      - name: Datei speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windguru.json
          git diff --staged --quiet && exit 0
          git commit -m "Windguru-Daten aktualisieren"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            sleep 10
          done
          exit 1
